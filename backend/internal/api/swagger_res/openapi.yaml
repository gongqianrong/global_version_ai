                        type: object
                        properties:
                          product_id:
                            type: string
                          user_id:
                            type: integer
                            format: int64
                          quantity:
                            type: integer
                          price_at_add:
                            type: integer
                            format: int64
                          added_at:
                            type: string
                            format: date-time

  /api/v1/cart/{productID}:
    put:
      tags: [Cart]
      summary: 修改购物车商品数量
      operationId: updateCartQuantity
      security:
        - BearerAuth: []
      parameters:
        - name: productID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          product_id:
                            type: string
                          quantity:
                            type: integer
    delete:
      tags: [Cart]
      summary: 从购物车移除商品
      operationId: removeFromCart
      security:
        - BearerAuth: []
      parameters:
        - name: productID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 移除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
