  # ────────── Orders ──────────
  /api/v1/order/settlement:
    post:
      tags: [Orders]
      summary: 订单结算预览
      operationId: orderSettlement
      security:
        - BearerAuth: []
      description: 预览订单价格，不写入数据库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/OrderItem"
      responses:
        "200":
          description: 结算预览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderTotalJp:
                            type: integer
                            format: int64
                          commissionFeeJp:
                            type: integer
                            format: int64
                          orderInpriceJp:
                            type: integer
                            format: int64
                          orderRate:
                            type: integer
                          orderPaytype:
                            type: integer
                          orderType:
                            type: integer
                          isChange:
                            type: integer
                          orderDetailList:
                            type: array
                            items:
                              $ref: "#/components/schemas/SettlementDetail"
                          walletBalance:
                            type: integer
                            format: int64
                          totalShippingFee:
                            type: integer
                            format: int64

  /api/v1/order/confirm:
    post:
      tags: [Orders]
      summary: 确认下单
      operationId: orderConfirm
      security:
        - BearerAuth: []
      description: 创建待付款订单，从购物车移除对应商品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/OrderItem"
                order_paytype:
                  type: integer
                order_remark:
                  type: string
                order_purchase_type:
                  type: integer
                  default: 1
      responses:
        "200":
          description: 订单已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderNumber:
                            type: string
                            example: RO20260304120000a1b2
                          orderState:
                            type: integer
                            example: 0
                          orderTotalJp:
                            type: integer
                            format: int64
                          commissionFeeJp:
                            type: integer
                            format: int64
                          orderInpriceJp:
                            type: integer
                            format: int64
                          orderPaytype:
                            type: integer
                          orderDetailList:
                            type: array
                            items:
                              $ref: "#/components/schemas/SettlementDetail"
                          totalShippingFee:
                            type: integer
                            format: int64

  /api/v1/order/pay:
    post:
      tags: [Orders]
      summary: 支付订单
      operationId: orderPay
      security:
        - BearerAuth: []
      description: 使用钱包余额支付待付款订单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_number]
              properties:
                order_number:
                  type: string
      responses:
        "200":
          description: 支付成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderNumber:
                            type: string
                          orderState:
                            type: integer
                            example: 1
                          paidAmount:
                            type: integer
                            format: int64
                          balanceAfter:
                            type: integer
                            format: int64

  /api/v1/order/cancel:
    post:
      tags: [Orders]
      summary: 取消订单
      operationId: orderCancel
      security:
        - BearerAuth: []
      description: 仅可取消待付款状态的订单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_number]
              properties:
                order_number:
                  type: string
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderNumber:
                            type: string
                          orderState:
                            type: integer
                            example: 8

  /api/v1/order/{orderNumber}:
    get:
      tags: [Orders]
      summary: 订单详情
      operationId: getOrder
      security:
        - BearerAuth: []
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 订单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderResponse"

  /api/v1/orders:
    get:
      tags: [Orders]
      summary: 订单列表
      operationId: listOrders
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: state
          in: query
          description: "订单状态过滤，-1=全部"
          schema:
            type: integer
            default: -1
      responses:
        "200":
          description: 订单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/OrderResponse"
                          total:
                            type: integer
                            format: int64
                          page:
                            type: integer

  # ────────── Recharge ──────────
  /api/v1/wallet/pay-methods:
    get:
      tags: [Recharge]
      summary: 获取支付方式列表
      operationId: getPayMethods
      security:
        - BearerAuth: []
      description: 返回所有支持的支付方式，available=false 表示预留待对接
      responses:
        "200":
          description: 支付方式列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          methods:
                            type: array
                            items:
                              $ref: "#/components/schemas/PayMethodInfo"

  /api/v1/wallet/recharge:
    post:
      tags: [Recharge]
      summary: 创建充值订单
      operationId: createRecharge
      security:
        - BearerAuth: []
      description: |
        创建充值订单，返回支付跳转参数。
        金额范围：1,000 ～ 500,000 日元。
        支付方式须为 available=true 的方式。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_jpy, pay_method]
              properties:
                amount_jpy:
                  type: integer
                  format: int64
                  minimum: 1000
                  maximum: 500000
                  example: 5000
                pay_method:
                  type: string
                  example: "wechat_pay"
      responses:
        "200":
          description: 充值订单创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          recharge_no:
                            type: string
                            example: "RC202603121530ABCD"
                          amount_jpy:
                            type: integer
                            format: int64
                          pay_method:
                            type: string
                          state:
                            type: integer
                            example: 0
                          pay_params:
                            type: object
                            description: 支付网关返回的跳转参数（各支付方式格式不同）
        "400":
          description: 金额超范围或支付方式不支持

  /api/v1/wallet/recharge/{rechargeNo}:
    get:
      tags: [Recharge]
      summary: 查询充值订单状态
      operationId: getRechargeStatus
      security:
        - BearerAuth: []
      parameters:
        - name: rechargeNo
          in: path
          required: true
          schema:
            type: string
          example: "RC202603121530ABCD"
      responses:
        "200":
          description: 充值订单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RechargeOrder"
        "404":
          description: 订单不存在或不属于当前用户

  /api/v1/wallet/recharge/callback/{method}:
    post:
      tags: [Recharge]
      summary: 支付回调（支付网关调用）
      operationId: rechargeCallback
      description: |
        供支付网关服务端回调，无需 JWT。
        幂等设计：同一订单重复回调不重复处理。
        回调成功后自动给用户钱包充值并将充值订单标记为已支付。
      parameters:
        - name: method
          in: path
          required: true
          schema:
            type: string
          description: 支付方式标识（如 wechat_pay / alipay）
          example: "wechat_pay"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 各支付网关的回调格式不同，由网关适配层解析
      responses:
        "200":
          description: 回调处理成功

  # ────────── Waybill ──────────
  /api/v1/waybill/apply:
    post:
      tags: [Waybill]
      summary: 申请国际发货（创建运单）
      operationId: applyShipment
      security:
        - BearerAuth: []
      description: |
        用户选择一个或多个已入库订单，申请打包发往收货地址。
        创建运单（state=待合单），关联订单状态更新为打包中。
        所选订单必须均处于已入库（warehoused）状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_numbers]
              properties:
                order_numbers:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  example: ["RO202603120001", "RO202603120002"]
                remark:
                  type: string
                  description: 用户备注（如：请勿折叠）
                  example: "请勿折叠"
      responses:
        "200":
          description: 运单创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Waybill"
        "400":
          description: 订单未入库或不属于当前用户

  /api/v1/waybills:
    get:
      tags: [Waybill]
      summary: 运单列表
      operationId: listWaybills
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: 运单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Waybill"
                          total:
                            type: integer
                            format: int64
                          page:
                            type: integer

  /api/v1/waybill/{waybillNo}:
    get:
      tags: [Waybill]
      summary: 运单详情
      operationId: getWaybill
      security:
        - BearerAuth: []
      parameters:
        - name: waybillNo
          in: path
          required: true
          schema:
            type: string
          example: "LO202603121530ABCD"
      responses:
        "200":
          description: 运单详情及关联订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          waybill:
                            $ref: "#/components/schemas/Waybill"
                          orders:
                            type: array
                            items:
                              $ref: "#/components/schemas/WaybillOrder"
        "404":
          description: 运单不存在或不属于当前用户

  /api/v1/waybill/{waybillNo}/pay-shipping:
    post:
      tags: [Waybill]
      summary: 支付国际运费
      operationId: payShippingFee
      security:
        - BearerAuth: []
      description: |
        从钱包余额扣除国际运费，运单状态从待支付变为待出库。
        运费由仓库打包完成后填写，可在运单详情中查看 shipping_fee_jpy。
      parameters:
        - name: waybillNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 支付成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          waybill_no:
                            type: string
                          state:
                            type: integer
                            example: 3
                          state_label:
                            type: string
                            example: "待出库"
                          balance_after:
                            type: integer
                            format: int64
        "400":
          description: 运单状态不是待支付，或余额不足
        "404":
          description: 运单不存在

  /api/v1/waybill/{waybillNo}/confirm-receipt:
    post:
      tags: [Waybill]
      summary: 确认收货
      operationId: confirmReceipt
      security:
        - BearerAuth: []
      description: |
        用户确认收到国际包裹，运单状态从已发货变为已收货。
        同时将关联订单状态更新为已完成（fulfilled）。
      parameters:
        - name: waybillNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 确认收货成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          waybill_no:
                            type: string
                          state:
                            type: integer
                            example: 5
                          state_label:
                            type: string
                            example: "已收货"
        "400":
          description: 运单尚未发货，不可确认收货
        "404":
          description: 运单不存在

  # ────────── Admin ──────────
  /api/v1/admin/wallet/adjust:
    post:
      tags: [Admin]
      summary: 管理员调整用户钱包
      operationId: adminWalletAdjust
      security:
        - BearerAuth: []
      description: 需要管理员权限（is_admin=true）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, amount, type, description]
              properties:
                user_id:
                  type: integer
                  format: int64
                amount:
                  type: integer
                  format: int64
                  description: 非零金额（正=充值，负=扣减）
                type:
                  type: string
                  enum: [recharge, adjustment, refund]
                description:
                  type: string
                related_order:
                  type: string
      responses:
        "200":
          description: 调整成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          balance:
                            type: integer
                            format: int64
                          transaction_id:
                            type: integer
                            format: int64

  /api/v1/admin/orders/{orderNumber}/state:
    post:
      tags: [Admin]
      summary: 更新订单状态（自动化脚本专用）
      operationId: adminUpdateOrderState
      security:
        - BearerAuth: []
      description: |
        供自动化采购脚本和 WMS 驱动订单状态流转：
        - 已支付(1) → 采购中(2)：自动化脚本在日本平台采购成功后回写
        - 采购中(2) → 已入库(3)：WMS 扫码入库后回写

        非法跳跃（如 1→3）将被拒绝。
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: integer
                  description: "目标状态：2=采购中 3=已入库"
                  example: 2
      responses:
        "200":
          description: 状态更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order_number:
                            type: string
                          state:
                            type: integer
        "400":
          description: 非法状态转移
        "404":
          description: 订单不存在

  /api/v1/admin/waybill/{waybillNo}/state:
    post:
      tags: [Admin]
      summary: 更新运单状态（WMS 专用）
      operationId: adminUpdateWaybillState
      security:
        - BearerAuth: []
      description: |
        供 WMS 系统驱动运单状态流转（严格顺序）：
        - 待合单(0) → 待打包(1)：合单完成
        - 待打包(1) → 待支付(2)：打包完成，自动同步关联订单状态为 Packed，用户可支付运费
        - 待支付(2) → 待出库(3)：用户支付运费后（由 pay-shipping 接口触发）
        - 待出库(3) → 已发货(4)：仓库出库，自动同步关联订单状态为 Shipped
        - 已发货(4) → 已收货(5)：用户确认收货（由 confirm-receipt 接口触发）

        非法跳跃将被拒绝。
      parameters:
        - name: waybillNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: integer
                  description: "目标状态（见说明）"
                  example: 1
      responses:
        "200":
          description: 状态更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          waybill_no:
                            type: string
                          state:
                            type: integer
                          state_label:
                            type: string
        "400":
          description: 非法状态转移
        "404":
          description: 运单不存在

  /api/v1/admin/waybill/{waybillNo}/shipping-fee:
    put:
      tags: [Admin]
      summary: 设置国际运费（WMS 打包完成后填写）
      operationId: adminSetShippingFee
      security:
        - BearerAuth: []
      description: WMS 打包完成称重后，填写实际国际运费，用户据此支付。
      parameters:
        - name: waybillNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipping_fee_jpy]
              properties:
                shipping_fee_jpy:
                  type: integer
                  format: int64
                  minimum: 1
                  example: 3500
      responses:
        "200":
          description: 运费设置成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          waybill_no:
                            type: string
                          shipping_fee_jpy:
                            type: integer
                            format: int64

  /api/v1/admin/waybill/{waybillNo}/shipping-info:
    put:
      tags: [Admin]
      summary: 填写物流信息（WMS 发货时填写）
      operationId: adminSetShippingInfo
      security:
        - BearerAuth: []
      description: WMS 实际发货时填写承运商和物流单号，前端用于展示物流追踪。
      parameters:
        - name: waybillNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier, tracking_no]
              properties:
                carrier:
                  type: string
                  example: "EMS"
                tracking_no:
                  type: string
                  example: "EJ000000000JP"
                tracking_url:
                  type: string
                  example: "https://trackings.post.japanpost.jp/services/srv/search/?requestNo=EJ000000000JP"
                wms_waybill_no:
                  type: string
                  description: WMS 系统内部运单号（预留对接）
      responses:
        "200":
          description: 物流信息填写成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          waybill_no:
                            type: string
                          carrier:
                            type: string
                          tracking_no:
                            type: string

  # ────────── Recommendations ──────────
  /api/v1/preferences:
    post:
      tags: [Recommendations]
      summary: 设置用户喜好分类
      operationId: setPreferences
      security:
        - BearerAuth: []
      description: 替换用户的所有喜好分类（注册后选择）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categories]
              properties:
                categories:
                  type: array
                  items:
                    type: string
                  example: ["フィギュア", "ゲーム", "トレカ"]
      responses:
        "200":
          description: 设置成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          preferences:
                            type: array
                            items:
                              $ref: "#/components/schemas/UserPreference"
    get:
      tags: [Recommendations]
      summary: 获取用户喜好分类
      operationId: getPreferences
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 返回喜好列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          preferences:
                            type: array
                            items:
                              $ref: "#/components/schemas/UserPreference"

  /api/v1/track/view:
    post:
      tags: [Recommendations]
      summary: 记录商品浏览
      operationId: trackView
      security:
        - BearerAuth: []
      description: 异步记录浏览行为，同用户+同商品5分钟内去重
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: string
                  example: "surugaya_12345"
                category:
                  type: string
                  example: "フィギュア"
                brand:
                  type: string
                  example: "BANDAI"
                sellerId:
                  type: string
                platform:
                  type: string
                  example: "surugaya"
      responses:
        "200":
          description: 记录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/track/search:
    post:
      tags: [Recommendations]
      summary: 记录搜索行为
      operationId: trackSearch
      security:
        - BearerAuth: []
      description: 异步记录搜索关键词
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyword]
              properties:
                keyword:
                  type: string
                  example: "ワンピース フィギュア"
                keywordJa:
                  type: string
                  description: 日文翻译关键词（可选）
                platform:
                  type: string
      responses:
        "200":
          description: 记录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/recommendations:
    get:
      tags: [Recommendations]
      summary: 获取所有推荐列表
      operationId: getRecommendations
      security:
        - BearerAuth: []
      description: |
        返回所有类型的推荐列表，每个列表最多6个商品，第1个标记为 isHighlighted=true。
        结果缓存30分钟，可通过 refresh=true 强制刷新。
      parameters:
        - name: refresh
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: 是否强制刷新缓存
      responses:
        "200":
          description: 推荐列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          lists:
                            type: array
                            items:
                              $ref: "#/components/schemas/RecommendationList"

  /api/v1/recommendations/{listType}:
    get:
      tags: [Recommendations]
      summary: 获取单个推荐列表
      operationId: getRecommendationList
      security:
        - BearerAuth: []
      parameters:
        - name: listType
          in: path
          required: true
          schema:
            type: string
            enum: [for_you, browsing, sellers, new_arrivals]
          description: |
            - `for_you` — 综合推荐（混合所有维度权重）
            - `browsing` — 基于浏览历史
            - `sellers` — 关注卖家的商品
            - `new_arrivals` — 喜好分类的新品
        - name: refresh
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: 推荐列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          lists:
                            type: array
                            items:
                              $ref: "#/components/schemas/RecommendationList"
