openapi: "3.0.3"
info:
  title: Rakutao Collection Gateway API
  description: |
    乐淘集运网关 API，提供商品搜索、购物车、收藏、关注卖家、钱包、订单、充值、国际运单等功能。

    ## 认证方式
    受保护的接口需要在请求头中携带 JWT Token：
    ```
    Authorization: Bearer <token>
    ```
    Token 通过注册、登录或 OAuth 登录获取，有效期 72 小时。

    ## 多语言
    通过 `Accept-Language` 请求头指定语言（zh-TW / ja / en），默认 zh-TW。

    ## 通用响应格式
    ```json
    {
      "code": 0,
      "data": { ... },
      "message": "",
      "request_id": "xxx"
    }
    ```
    - `code=0` 表示成功，`data` 包含业务数据
    - `code≠0` 表示错误，`message` 包含错误描述
  version: "1.3.0"

servers:
  - url: https://api.rakutao.vip
    description: Production
  - url: http://52.195.4.10:8080
    description: Dev

tags:
  - name: Public
    description: 公开接口（健康检查、搜索、商品详情）
  - name: Surugaya
    description: 骏河屋扩展接口（评论、店铺、折扣、活动、分类）
  - name: Auth
    description: 注册 / 登录 / OAuth
  - name: Cart
    description: 购物车（需 JWT）
  - name: Favorites
    description: 收藏夹（需 JWT）
  - name: Sellers
    description: 关注卖家（需 JWT）
  - name: Wallet
    description: 钱包（需 JWT）
  - name: Orders
    description: 订单（需 JWT）
  - name: Recommendations
    description: 推荐系统（喜好设置、行为追踪、个性化推荐，需 JWT）
  - name: Recharge
    description: 钱包充值（支付方式查询、创建充值订单、回调处理，需 JWT）
  - name: Waybill
    description: 国际运单（申请发货、运单列表、支付运费、确认收货，需 JWT）
  - name: Admin
    description: 管理员接口（需 JWT + admin）

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
        message:
          type: string
        request_id:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user_id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string

    ProductSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        title_original:
          type: string
        description:
          type: string
        price_jpy:
          type: integer
          format: int64
        platform:
          type: string
        status:
          type: string
        is_translated:
          type: boolean
        images:
          type: array
          items:
            type: string

    ProductDetail:
      type: object
      properties:
        id:
          type: string
        platform:
          type: string
        title:
          type: string
        title_original:
          type: string
        description:
          type: string
        description_original:
          type: string
        images:
          type: array
          items:
            type: string
        price_jpy:
          type: integer
          format: int64
        service_fee_jpy:
          type: integer
          format: int64
        original_price:
          type: integer
          format: int64
        shipping_type:
          type: string
        shipping_fee_jpy:
          type: integer
          format: int64
        brand:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        categories:
          type: array
          items:
            type: string
        condition:
          type: string
        status:
          type: string
        quantity:
          type: integer
        seller:
          type: object
          properties:
            seller_id:
              type: string
            seller_name:
              type: string
        variants:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
        content_rating:
          type: string
        listed_at:
          type: string
          format: date-time
        is_translated:
          type: boolean

    CartGroup:
      type: object
      properties:
        seller_id:
          type: string
        seller_name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"

    CartItem:
      type: object
      properties:
        product_id:
          type: string
        quantity:
          type: integer
        price_at_add:
          type: integer
          format: int64
        current_price:
          type: integer
          format: int64
        price_changed:
          type: boolean
        title:
          type: string
        title_original:
          type: string
        image:
          type: string
        platform:
          type: string
        status:
          type: string
        seller_id:
          type: string
        seller_name:
          type: string
        is_translated:
          type: boolean

    FavoriteItem:
      type: object
      properties:
        product_id:
          type: string
        title:
          type: string
        title_original:
          type: string
        image:
          type: string
        price_jpy:
          type: integer
          format: int64
        platform:
          type: string
        status:
          type: string
        is_translated:
          type: boolean
        added_at:
          type: string
          format: date-time

    FollowedSeller:
      type: object
      properties:
        seller_id:
          type: string
        user_id:
          type: integer
          format: int64
        seller_name:
          type: string
        followed_at:
          type: string
          format: date-time

    WalletTransaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        type:
          type: string
          enum: [recharge, purchase, refund, adjustment]
        amount:
          type: integer
          format: int64
        balance_after:
          type: integer
          format: int64
        description:
          type: string
        related_order:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    SettlementDetail:
      type: object
      properties:
        goodsMid:
          type: string
        goodsName:
          type: string
        goodsNum:
          type: integer
        goodsImg:
          type: string
        goodsUrl:
          type: string
        goodsSellerId:
          type: string
        goodsAmountJp:
          type: integer
          format: int64
        commissionFeeJp:
          type: integer
          format: int64
        shippingFee:
          type: integer
          format: int64
        platform:
          type: string
        condition:
          type: string
        sellerId:
          type: string
        state:
          type: integer
        blockLevel:
          type: integer

    OrderDetail:
      type: object
      properties:
        goodsMid:
          type: string
        goodsName:
          type: string
        goodsNum:
          type: integer
        goodsImg:
          type: string
        goodsUrl:
          type: string
        goodsAmountJp:
          type: integer
          format: int64
        commissionFeeJp:
          type: integer
          format: int64
        shippingFee:
          type: integer
          format: int64
        sellerId:
          type: string
        sellerName:
          type: string
        platform:
          type: string
        condition:
          type: string
        state:
          type: integer

    OrderResponse:
      type: object
      properties:
        orderNumber:
          type: string
        orderState:
          type: integer
          description: "0=待付款 1=已付款 2=采购中 3=已入库 4=打包中 5=已打包 6=已发货 7=已完成 8=已取消 9=已退款"
        orderTotalJp:
          type: integer
          format: int64
        commissionFeeJp:
          type: integer
          format: int64
        shippingFeeJp:
          type: integer
          format: int64
        orderInpriceJp:
          type: integer
          format: int64
        orderPaytype:
          type: integer
        orderRemark:
          type: string
        firstGoodsImg:
          type: string
          description: 订单第一件商品图片，列表页展示用
          example: "https://img.example.com/goods/001.jpg"
        orderDetailList:
          type: array
          items:
            $ref: "#/components/schemas/OrderDetail"
        createdAt:
          type: string
          example: "2026-03-04 12:00:00"

    OrderItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1

    UserPreference:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        category:
          type: string
          example: "フィギュア"
        weight:
          type: number
          format: float
          example: 1.0
        createdAt:
          type: string
          format: date-time

    RecommendedProduct:
      type: object
      properties:
        id:
          type: string
          example: "surugaya_12345"
        title:
          type: string
          example: "ワンピース フィギュア"
        image:
          type: string
          format: uri
        priceJpy:
          type: integer
          format: int64
          example: 3500
        platform:
          type: string
          example: "surugaya"
        brand:
          type: string
          example: "BANDAI"
        condition:
          type: string
          example: "like_new"
        isHighlighted:
          type: boolean
          description: true 表示高权重推荐，前端可放大展示

    RecommendationList:
      type: object
      properties:
        type:
          type: string
          enum: [for_you, browsing, sellers, new_arrivals]
        title:
          type: string
          example: "おすすめ"
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedProduct"

    PayMethodInfo:
      type: object
      properties:
        method:
          type: string
          example: "wechat_pay"
        name:
          type: string
          example: "微信支付"
        available:
          type: boolean
          description: false 表示尚未对接，预留展示

    RechargeOrder:
      type: object
      properties:
        recharge_no:
          type: string
          example: "RC202603121530ABCD"
        user_id:
          type: integer
          format: int64
        amount_jpy:
          type: integer
          format: int64
          example: 5000
        pay_method:
          type: string
          example: "wechat_pay"
        state:
          type: integer
          description: "0=待支付 1=已支付 2=支付失败"
          example: 0
        created_at:
          type: string
          format: date-time

    Waybill:
      type: object
      properties:
        id:
          type: integer
          format: int64
        waybill_no:
          type: string
          example: "LO202603121530ABCD"
        user_id:
          type: integer
          format: int64
        state:
          type: integer
          description: "0=待合单 1=待打包 2=待支付 3=待出库 4=已发货 5=已收货"
          example: 0
        state_label:
          type: string
          example: "待合单"
        shipping_fee_jpy:
          type: integer
          format: int64
          description: 国际运费（打包后由仓库填写）
          example: 3000
        carrier:
          type: string
          description: 承运商
          example: "EMS"
        tracking_no:
          type: string
          description: 国际物流单号
          example: "EJ000000000JP"
        tracking_url:
          type: string
          description: 物流追踪链接
        wms_waybill_no:
          type: string
          description: WMS系统运单号（预留对接）
        remark:
          type: string
          description: 用户备注
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WaybillOrder:
      type: object
      properties:
        waybill_id:
          type: integer
          format: int64
        waybill_no:
          type: string
        order_number:
          type: string

paths:
  # ────────── Public ──────────
  /health:
    get:
      tags: [Public]
      summary: 健康检查
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  platforms:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                        message:
                          type: string

  /api/v1/search:
    get:
      tags: [Public]
      summary: 跨平台商品搜索
      operationId: search
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: price_min
          in: query
          schema:
            type: integer
            format: int64
        - name: price_max
          in: query
          schema:
            type: integer
            format: int64
        - name: platforms
          in: query
          description: 逗号分隔的平台列表
          schema:
            type: string
        - name: brand_id
          in: query
          schema:
            type: string
        - name: categories
          in: query
          description: 逗号分隔的分类列表
          schema:
            type: string
        - name: condition
          in: query
          description: 逗号分隔的成色条件
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: content_rating
          in: query
          schema:
            type: string
            default: general
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          hits:
                            type: object
                            properties:
                              total:
                                type: object
                                properties:
                                  value:
                                    type: integer
                                    format: int64
                              hits:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    _id:
                                      type: string
                                    _source:
                                      $ref: "#/components/schemas/ProductSummary"
                          realtime_stream_id:
                            type: string

  /api/v1/search/stream/{streamID}:
    get:
      tags: [Public]
      summary: 实时搜索结果（WebSocket）
      operationId: searchStream
      description: |
        WebSocket 连接，实时推送各平台搜索结果。

        消息类型：
        - `results`: 搜索结果
        - `error`: 错误
        - `done`: 搜索完成
      parameters:
        - name: streamID
          in: path
          required: true
          schema:
            type: string
      responses:
        "101":
          description: WebSocket 升级成功

  /api/v1/products/{id}:
    get:
      tags: [Public]
      summary: 商品详情
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 商品详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProductDetail"

  /api/v1/platform/search:
    get:
      tags: [Public]
      summary: 单平台搜索
      operationId: platformSearch
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
        - name: platform
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: price_min
          in: query
          schema:
            type: integer
            format: int64
        - name: price_max
          in: query
          schema:
            type: integer
            format: int64
        - name: brand_id
          in: query
          schema:
            type: string
        - name: categories
          in: query
          schema:
            type: string
        - name: condition
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: content_rating
          in: query
          schema:
            type: string
            default: general
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          products:
                            type: array
                            items:
                              $ref: "#/components/schemas/ProductSummary"
                          total:
                            type: integer
                            format: int64
                          platform:
                            type: string

  # ────────── Surugaya ──────────
  /api/v1/surugaya/products/{id}/reviews:
    get:
      tags: [Surugaya]
      summary: 商品评论
      operationId: surugayaProductReviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 评论数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/surugaya/products/{id}/stores:
    get:
      tags: [Surugaya]
      summary: 商品店铺信息
      operationId: surugayaProductStores
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 店铺数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/surugaya/discounts:
    get:
      tags: [Surugaya]
      summary: 折扣信息
      operationId: surugayaDiscounts
      responses:
        "200":
          description: 折扣数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/surugaya/comments:
    get:
      tags: [Surugaya]
      summary: 用户评论
      operationId: surugayaComments
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: "-created_at"
      responses:
        "200":
          description: 评论列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/surugaya/campaigns:
    get:
      tags: [Surugaya]
      summary: 活动列表
      operationId: surugayaCampaigns
      responses:
        "200":
          description: 活动数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/surugaya/campaigns/detail:
    get:
      tags: [Surugaya]
      summary: 活动详情
      operationId: surugayaCampaignDetail
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 活动详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/surugaya/categories:
    get:
      tags: [Surugaya]
      summary: 分类列表
      operationId: surugayaCategories
      responses:
        "200":
          description: 分类数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/surugaya/categories/{id}:
    get:
      tags: [Surugaya]
      summary: 子分类
      operationId: surugayaSubCategories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 子分类数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  # ────────── Auth ──────────
  /api/v1/auth/send-code:
    post:
      tags: [Auth]
      summary: 发送邮箱验证码
      operationId: sendCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: 验证码已发送
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: verification code sent

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 邮箱注册
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, nickname, code]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                nickname:
                  type: string
                code:
                  type: string
                  description: 6位邮箱验证码
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthResponse"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 邮箱登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthResponse"

  /api/v1/auth/google:
    post:
      tags: [Auth]
      summary: Google OAuth 登录
      operationId: googleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
                  description: Google ID Token (JWT)
      responses:
        "200":
          description: 登录成功
