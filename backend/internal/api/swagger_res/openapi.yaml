                            type: array
                            items:
                              $ref: "#/components/schemas/CartGroup"
                          total_items:
                            type: integer
    post:
      tags: [Cart]
      summary: 添加商品到购物车
      operationId: addToCart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
