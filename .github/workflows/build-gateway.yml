name: Build and Commit Gateway Binary

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**/*.go'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - '.github/workflows/build-gateway.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          go-version-file: 'backend/go.mod'

      - name: Build Linux binary
        working-directory: ./backend
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -trimpath \
            -o bin/gateway-linux-amd64 ./cmd/gateway
          
          ls -lh bin/gateway-linux-amd64
          file bin/gateway-linux-amd64
          echo "Binary size: $(du -h bin/gateway-linux-amd64 | cut -f1)"

      - name: Check if binary changed
        id: check_changes
        run: |
          if git diff --quiet backend/bin/gateway-linux-amd64 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/bin/gateway-linux-amd64
          BINARY_SIZE=$(du -h backend/bin/gateway-linux-amd64 | cut -f1)
          git commit -m "build: 自动编译gateway二进制 (${BINARY_SIZE}) [skip ci]"
          git push
