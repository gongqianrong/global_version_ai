services:
  gateway:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ES_INDEX_NAME=rakutao_products
      - AI_SERVICE_URL=http://ai-service:8000
      - SURUGAYA_API_URL=http://153.231.197.185
      - YAHOO_AUCTION_API_URL=http://yahoo-proxy:3001
      - REDIS_URL=redis://redis:6379
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  elasticsearch:
    build: ./elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  es-init:
    image: curlimages/curl:latest
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backend/internal/search/index.json:/index.json:ro
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        echo "Checking if index exists..."
        CODE=$$(curl -s -o /dev/null -w "%{http_code}" http://elasticsearch:9200/rakutao_products)
        if [ "$$CODE" = "200" ]; then
          echo "Index rakutao_products already exists, skipping."
          exit 0
        fi
        echo "Creating index rakutao_products..."
        curl -sf -X PUT http://elasticsearch:9200/rakutao_products \
          -H "Content-Type: application/json" \
          -d @/index.json
        echo ""
        echo "Index created successfully."

  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "5000:5000"
    environment:
      - LT_LOAD_ONLY=ja,en,zh
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/languages || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

