services:
  gateway:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - elasticsearch
      - redis
      - postgres
      - ai-service
    environment:
      - ES_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgres://rakutao:rakutao@postgres:5432/rakutao?sslmode=disable
      - AI_SERVICE_URL=http://ai-service:8000

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    command: >
      bash -c "elasticsearch-plugin install --batch analysis-kuromoji analysis-icu || true && /usr/local/bin/docker-entrypoint.sh elasticsearch"
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=rakutao
      - POSTGRES_PASSWORD=rakutao
      - POSTGRES_DB=rakutao
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  es-data:
  pg-data:
